name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build
        run: |
          mkdir www && cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          npx cap init mYm id.keuanganku.app --web-dir www
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/></manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Siapkan APK
        run: |
          VER=$(grep -o 'APP_VER="[0-9.]*"' index.html | cut -d'"' -f2)
          echo "VER=$VER" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/debug/app-debug.apk mYm.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: mYm v${{ env.VER }}
          files: mYm.apk
