name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Web & Mobile
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/ 2>/dev/null || true
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          npx cap init KeuanganKu id.keuanganku.app --web-dir www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Keuanganku-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
